name: lophoc-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lophoc
      POSTGRES_PASSWORD: lophoc
      POSTGRES_DB: lophoc
    ports:
      # 5433 on host: 5432 is commonly taken by a local PostgreSQL install
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lophoc -d lophoc']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: lophoc
      MINIO_ROOT_PASSWORD: lophoc123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 lophoc lophoc123; do sleep 1; done;
      mc mb --ignore-existing local/lophoc;
      mc anonymous set download local/lophoc;
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  pgdata:
  miniodata:
