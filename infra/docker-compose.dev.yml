name: lophoc-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lophoc
      POSTGRES_PASSWORD: lophoc
      POSTGRES_DB: lophoc
    ports:
      # 5433 on host: 5432 is commonly taken by a local PostgreSQL install
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lophoc -d lophoc']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  pgdata:
